[env:esp32dev]
lib_deps = bblanchon/ArduinoJson@^7.2
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Wireless updates after the first USB flash:  pio run -e ota -t upload
[env:ota]
lib_deps = bblanchon/ArduinoJson@^7.2
extends = env:esp32dev
upload_protocol = espota
upload_port = tankbot.local
extra_scripts = post:ota_auth.py
